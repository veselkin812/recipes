<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Равнодушные к еде!</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#5b2343">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --plum: #5b2343;
      --plum-dark: #431730;
      --berry: #9e3b68;
      --berry-soft: #f6e7ee;
      --bg-base: #f5ece2;
      --bg-warm: #ead9c8;
      --card: rgba(255, 252, 249, 0.92);
      --text: #2c1824;
      --muted: #6f5664;
      --border: #e2cfd6;
      --danger: #b8334a;
      --danger-hover: #962539;
      --btn-gradient: linear-gradient(135deg, #5b2343 0%, #9e3b68 100%);
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      scrollbar-width: thick;
      scrollbar-color: #9e3b68 #ebd6e0;
    }

    ::-webkit-scrollbar {
      width: 16px;
      height: 16px;
    }

    ::-webkit-scrollbar-track {
      background: #ebd6e0;
      border-radius: 999px;
      border: 2px solid rgba(91, 35, 67, 0.08);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--btn-gradient);
      border-radius: 999px;
      border: 3px solid #ebd6e0;
    }

    ::-webkit-scrollbar-thumb:hover {
      filter: brightness(1.08);
    }

    body {
      margin: 0;
      color: var(--text);
      line-height: 1.55;
      min-height: 100vh;
      background-color: var(--bg-base);
      background-image:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 255, 255, 0.60) 50%,
          rgba(255, 255, 255, 0.74) 100%
        ),
        url("bg.jpg");
      background-size: cover, cover;
      background-position: center center, center center;
      background-repeat: no-repeat, no-repeat;
      background-attachment: fixed, fixed;
    }

    /* Стартовая заставка на 2 секунды */
    .splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .splash-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-image {
      max-width: min(86vw, 460px);
      max-height: 75vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .container {
      width: 100%;
      max-width: 1410px;
      margin: 24px auto 44px;
      padding: 0 20px;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .sidebar {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 8px 22px rgba(91, 35, 67, 0.07);
      position: sticky;
      top: 24px;
    }

    .sidebar-title {
      margin: 0 0 12px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      font-weight: 800;
      padding: 0 6px;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .cat-btn {
      width: 100%;
      text-align: left;
      background: var(--berry-soft);
      color: var(--plum);
      border: 1px solid #dec0cf;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .cat-btn:hover {
      background: #edd7e2;
      transform: translateX(2px);
    }

    .cat-btn.active {
      background: var(--btn-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(91, 35, 67, 0.24);
    }

    .main-column {
      min-width: 0;
    }

    .btn {
      background: var(--btn-gradient);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 4px 12px rgba(91, 35, 67, 0.22);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(91, 35, 67, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .btn-secondary {
      background: var(--berry-soft);
      color: var(--plum);
      box-shadow: none;
      border: 1px solid #d9b8c8;
    }

    .btn-secondary:hover {
      background: #edd7e2;
      filter: none;
      box-shadow: none;
    }

    .btn-steps {
      background: var(--berry-soft);
      color: var(--plum);
      border: 1.5px solid #cfaec0;
      padding: 7px 13px;
      font-size: 0.85rem;
      box-shadow: none;
      margin-right: auto;
    }

    .btn-steps:hover {
      background: #ebd3df;
      border-color: var(--plum);
      box-shadow: 0 3px 8px rgba(91, 35, 67, 0.12);
    }

    .btn-steps.open {
      background: var(--btn-gradient);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(91, 35, 67, 0.2);
    }

    .btn-icon-round {
      background: var(--btn-gradient);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(91, 35, 67, 0.24);
    }

    .btn-icon-round:hover {
      filter: brightness(1.08);
      box-shadow: 0 5px 14px rgba(91, 35, 67, 0.32);
    }

    .card-share-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      border: 1.5px solid rgba(255, 255, 255, 0.72);
    }

    .btn-danger {
      background: var(--danger);
      padding: 8px 14px;
      font-size: 0.85rem;
      box-shadow: 0 3px 8px rgba(184, 51, 74, 0.2);
    }

    .btn-danger:hover {
      background: var(--danger-hover);
      box-shadow: 0 4px 10px rgba(184, 51, 74, 0.28);
    }

    /* Форма добавления / редактирования */
    .form-card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 28px rgba(91, 35, 67, 0.08);
      display: none;
    }

    .form-card.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .categories-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .categories-row .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--plum);
    }

    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255, 253, 251, 0.95);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--berry);
      box-shadow: 0 0 0 3px rgba(158, 59, 104, 0.14);
    }

    textarea.recipe-textarea {
      resize: vertical;
      min-height: 184px;
    }

    .file-input-hidden {
      display: none;
    }

    .file-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .file-name-label {
      font-size: 0.9rem;
      color: var(--muted);
      background: rgba(255, 253, 251, 0.95);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .current-photo-box {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--berry-soft);
      border-radius: 12px;
      border: 1px solid #dec0cf;
    }

    .current-photo-box.active {
      display: flex;
    }

    .current-photo-box img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Строка поиска + кнопка добавления + статус облака + замок */
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-bar {
      position: relative;
      flex: 1 1 300px;
      min-width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--berry);
      display: flex;
      pointer-events: none;
    }

    .search-bar input[type="text"] {
      padding-left: 46px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(91, 35, 67, 0.05);
    }

    .sync-badge {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--plum);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(91, 35, 67, 0.05);
      transition: background 0.18s;
    }

    .sync-badge:hover {
      background: var(--berry-soft);
    }

    .lock-badge {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--plum);
      border-radius: 50%;
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(91, 35, 67, 0.05);
      transition: background 0.18s, transform 0.14s;
    }

    .lock-badge:hover {
      background: var(--berry-soft);
      transform: translateY(-1px);
    }

    /* Сетка карточек */
    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    .recipe-card {
      position: relative;
      background: var(--card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 22px rgba(91, 35, 67, 0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .recipe-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(91, 35, 67, 0.12);
    }

    .recipe-img {
      width: 100%;
      height: 205px;
      object-fit: cover;
      background: var(--berry-soft);
    }

    .recipe-body {
      padding: 18px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .recipe-title {
      margin: 0 0 10px;
      font-size: 1.22rem;
      font-weight: 800;
      color: var(--plum);
    }

    .recipe-card.no-photo .recipe-title {
      padding-right: 44px;
    }

    .recipe-section-title {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--plum);
      background: var(--berry-soft);
      padding: 3px 9px;
      border-radius: 999px;
      margin: 10px 0 6px;
      font-weight: 700;
    }

    .recipe-text {
      white-space: pre-line;
      font-size: 0.95rem;
      margin: 0;
      color: var(--text);
    }

    .steps-panel {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      background: rgba(253, 247, 249, 0.95);
      border: 1px solid #e4c9d6;
      border-radius: 12px;
    }

    .steps-panel.open {
      display: block;
    }

    .steps-panel .recipe-section-title {
      margin-top: 0;
    }

    .recipe-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 16px;
    }

    .recipe-tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--berry-soft);
      border: 1px solid #dcb9ca;
      color: var(--plum);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .recipe-footer {
      margin-top: auto;
      padding-top: 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 44px 20px;
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      border: 1.5px dashed #d4b8c6;
    }

    /* Модальные окна (поделиться и ввод пароля) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(44, 24, 36, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 252, 249, 0.98);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(91, 35, 67, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--plum);
    }

    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #d9b8c8;
      background: var(--berry-soft);
      color: var(--plum);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .modal-subtitle {
      margin: 0 0 16px;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    .pin-error-text {
      color: var(--danger);
      font-size: 0.85rem;
      font-weight: 600;
      margin: 8px 0 0;
      min-height: 1.2em;
    }

    .share-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .share-option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      border-radius: 14px;
      border: 1px solid #dec0cf;
      background: var(--berry-soft);
      color: var(--plum);
      font-size: 0.93rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.14s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .share-option-btn:hover {
      background: #edd7e2;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(91, 35, 67, 0.14);
    }

    .share-option-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-gradient);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .share-copy-row {
      margin-top: 10px;
    }

    .share-copy-btn {
      width: 100%;
      justify-content: center;
    }

    @media (max-width: 860px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .category-list {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .cat-btn {
        width: auto;
      }
    }

    @media (max-width: 560px) {
      .categories-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<!-- Стартовая заставка на 2 секунды -->
<div class="splash-screen" id="splashScreen" aria-hidden="true">
  <img src="./splash.png" alt="Равнодушные к еде!" class="splash-image" onerror="this.style.display='none'">
</div>

<div class="container">
  <div class="app-layout">
    <!-- Левая панель выбора категории -->
    <aside class="sidebar" aria-label="Категории рецептов">
      <h2 class="sidebar-title">Категории</h2>
      <div class="category-list" id="categoryButtons"></div>
    </aside>

    <!-- Основная область с формой, поиском и карточками -->
    <div class="main-column">
      <form class="form-card" id="recipeForm">
        <h2 id="formTitle" style="margin-top:0; color: var(--plum);">Новый рецепт</h2>

        <div class="form-group">
          <label for="title">Название блюда *</label>
          <input type="text" id="title" placeholder="Например: Сливовый крамбл" required>
        </div>

        <div class="categories-row">
          <div class="form-group">
            <label for="category">Основная категория *</label>
            <select id="category" required>
              <option value="" disabled selected>Выберите категорию...</option>
              <option value="Завтрак">Завтрак</option>
              <option value="Закуски">Закуски</option>
              <option value="Супы">Супы</option>
              <option value="Вторые блюда">Вторые блюда</option>
              <option value="Гарниры">Гарниры</option>
              <option value="Соусы">Соусы</option>
              <option value="Гриль и казан">Гриль и казан</option>
              <option value="Консервация">Консервация</option>
              <option value="Выпечка">Выпечка</option>
              <option value="Мороженое">Мороженое</option>
              <option value="Напитки">Напитки</option>
              <option value="Алкоголь">Алкоголь</option>
              <option value="Новогоднее меню">Новогоднее меню</option>
              <option value="Прочее">Прочее</option>
            </select>
          </div>

          <div class="form-group">
            <label for="categorySecondary">Дополнительная категория (необязательно)</label>
            <select id="categorySecondary">
              <option value="" selected>Без второй категории</option>
              <option value="Завтрак">Завтрак</option>
              <option value="Закуски">Закуски</option>
              <option value="Супы">Супы</option>
              <option value="Вторые блюда">Вторые блюда</option>
              <option value="Гарниры">Гарниры</option>
              <option value="Соусы">Соусы</option>
              <option value="Гриль и казан">Гриль и казан</option>
              <option value="Консервация">Консервация</option>
              <option value="Выпечка">Выпечка</option>
              <option value="Мороженое">Мороженое</option>
              <option value="Напитки">Напитки</option>
              <option value="Алкоголь">Алкоголь</option>
              <option value="Новогоднее меню">Новогоднее меню</option>
              <option value="Прочее">Прочее</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="ingredients">Ингредиенты *</label>
          <textarea id="ingredients" class="recipe-textarea" placeholder="Сливы — 600 г&#10;Мука — 120 г&#10;Сливочное масло — 80 г" required></textarea>
        </div>

        <div class="form-group">
          <label for="steps">Описание действий *</label>
          <textarea id="steps" class="recipe-textarea" placeholder="1. Нарезать сливы и выложить в форму...&#10;2. Перетереть масло с мукой и сахаром..." required></textarea>
        </div>

        <div class="form-group">
          <label for="photo">Фото блюда (необязательно)</label>
          <input type="file" id="photo" class="file-input-hidden" accept="image/*">
          <div class="file-picker-row">
            <button type="button" class="btn" id="choosePhotoBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              Выбрать фото
            </button>
            <span class="file-name-label" id="fileNameLabel">Файл не выбран</span>
          </div>

          <div class="current-photo-box" id="currentPhotoBox">
            <img id="currentPhotoPreview" src="" alt="Текущее фото">
            <div style="font-size: 0.85rem; color: var(--plum);">
              Сейчас используется это фото. Нажмите «Выбрать фото» выше, чтобы заменить его.
            </div>
          </div>
        </div>

<!-- Окно ввода семейного пароля для редактирования -->
<div class="modal-backdrop" id="pinBackdrop" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
  <form class="modal-card" id="pinForm">
    <div class="modal-header">
      <h3 class="modal-title" id="pinModalTitle">Семейный пароль</h3>
      <button type="button" class="modal-close-btn" id="pinCloseBtn" aria-label="Закрыть">×</button>
    </div>
    <p class="modal-subtitle">Просмотр открыт всем, а для добавления и изменения рецептов нужен семейный код.</p>
    <input type="password" id="pinInput" placeholder="Введите семейный пароль..." autocomplete="current-password" required>
    <p class="pin-error-text" id="pinErrorText"></p>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:8px;">
      <button type="button" class="btn btn-secondary" id="pinCancelBtn">Отмена</button>
      <button type="submit" class="btn">Подтвердить</button>
    </div>
  </form>
</div>

<script>
  // Надёжное скрытие стартовой заставки ровно через 2 секунды
  function hideSplashScreen() {
    const splash = document.getElementById('splashScreen');
    if (!splash || splash.dataset.hiding === 'true') return;
    splash.dataset.hiding = 'true';

    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => splash.remove(), 500);
    }, 2000);
  }

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', hideSplashScreen, { once: true });
  } else {
    hideSplashScreen();
  }

  // === ДАННЫЕ ПОДКЛЮЧЕНИЯ К SUPABASE ===
  const SUPABASE_URL = 'https://opznzjjongbekbzsjwrb.supabase.co'.trim();
  const SUPABASE_ANON_KEY = 'sb_publishable_KkIGdmp4EipvWJjJkJQ45Q_wIuDkUfq'.trim();
  // =====================================

  const PIN_STORAGE_KEY = 'family_recipes_pin';
  let familyPin = localStorage.getItem(PIN_STORAGE_KEY) || '';
  let pendingProtectedAction = null;

  const hasValidUrl =
    SUPABASE_URL.startsWith('https://') &&
    SUPABASE_URL.includes('.supabase.co');

  const hasValidKey =
    SUPABASE_ANON_KEY.length > 20 &&
    !SUPABASE_ANON_KEY.includes('ВСТАВЬ_СЮДА');

  const hasLibrary = Boolean(window.supabase && window.supabase.createClient);

  function getDbClient() {
    if (!hasValidUrl || !hasValidKey || !hasLibrary) return null;
    const headers = familyPin ? { 'x-family-pin': familyPin } : {};
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: { headers }
    });
  }

  const CATEGORIES = [
    'Завтрак',
    'Закуски',
    'Супы',
    'Вторые блюда',
    'Гарниры',
    'Соусы',
    'Гриль и казан',
    'Консервация',
    'Выпечка',
    'Мороженое',
    'Напитки',
    'Алкоголь',
    'Новогоднее меню',
    'Прочее'
  ];

  let recipes = JSON.parse(localStorage.getItem('family_recipes')) || [];
  let editingId = null;
  let selectedCategory = 'Все';
  let activeShareText = '';
  const expandedStepsIds = new Set();

  const form = document.getElementById('recipeForm');
  const formTitle = document.getElementById('formTitle');
  const submitBtn = document.getElementById('submitBtn');
  const toggleFormBtn = document.getElementById('toggleFormBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const container = document.getElementById('recipesContainer');
  const searchInput = document.getElementById('searchInput');
  const categorySelect = document.getElementById('category');
  const categorySecondarySelect = document.getElementById('categorySecondary');
  const categoryButtonsContainer = document.getElementById('categoryButtons');
  const photoInput = document.getElementById('photo');
  const choosePhotoBtn = document.getElementById('choosePhotoBtn');
  const fileNameLabel = document.getElementById('fileNameLabel');
  const currentPhotoBox = document.getElementById('currentPhotoBox');
  const currentPhotoPreview = document.getElementById('currentPhotoPreview');
  const syncBadge = document.getElementById('syncBadge');
  const lockBadge = document.getElementById('lockBadge');

  const shareBackdrop = document.getElementById('shareBackdrop');
  const shareCloseBtn = document.getElementById('shareCloseBtn');
  const shareRecipeSubtitle = document.getElementById('shareRecipeSubtitle');
  const shareTelegramLink = document.getElementById('shareTelegramLink');
  const shareWhatsappLink = document.getElementById('shareWhatsappLink');
  const shareSmsLink = document.getElementById('shareSmsLink');
  const shareEmailLink = document.getElementById('shareEmailLink');
  const shareCopyBtn = document.getElementById('shareCopyBtn');

  const pinBackdrop = document.getElementById('pinBackdrop');
  const pinForm = document.getElementById('pinForm');
  const pinInput = document.getElementById('pinInput');
  const pinErrorText = document.getElementById('pinErrorText');
  const pinCloseBtn = document.getElementById('pinCloseBtn');
  const pinCancelBtn = document.getElementById('pinCancelBtn');

  function updateLockButton() {
    if (familyPin) {
      lockBadge.textContent = '🔓';
      lockBadge.title = 'Семейный пароль сохранён — нажмите, чтобы сбросить';
      lockBadge.setAttribute('aria-label', 'Сбросить семейный пароль');
    } else {
      lockBadge.textContent = '🔒';
      lockBadge.title = 'Введите семейный пароль для редактирования';
      lockBadge.setAttribute('aria-label', 'Ввести семейный пароль');
    }
  }

  function resetFormState() {
    editingId = null;
    form.reset();
    categorySelect.value = '';
    categorySecondarySelect.value = '';
    formTitle.textContent = 'Новый рецепт';
    submitBtn.textContent = 'Сохранить рецепт';
    submitBtn.disabled = false;
    fileNameLabel.textContent = 'Файл не выбран';
    currentPhotoBox.classList.remove('active');
    currentPhotoPreview.src = '';
    form.classList.remove('active');
  }

  function clearSavedPin() {
    familyPin = '';
    localStorage.removeItem(PIN_STORAGE_KEY);
    resetFormState();
    updateLockButton();
  }

  lockBadge.addEventListener('click', () => {
    if (familyPin) {
      clearSavedPin();
    } else {
      openPinModal(null);
    }
  });

  function openPinModal(actionCallback, errorMsg = '') {
    pendingProtectedAction = actionCallback;
    pinErrorText.textContent = errorMsg;
    pinInput.value = '';
    pinBackdrop.classList.add('open');
    setTimeout(() => pinInput.focus(), 50);
  }

  function closePinModal() {
    pinBackdrop.classList.remove('open');
    pendingProtectedAction = null;
    pinErrorText.textContent = '';
  }

  function requirePin(actionCallback) {
    if (familyPin) {
      actionCallback();
    } else {
      openPinModal(actionCallback);
    }
  }

  pinCloseBtn.addEventListener('click', closePinModal);
  pinCancelBtn.addEventListener('click', closePinModal);
  pinBackdrop.addEventListener('click', (e) => {
    if (e.target === pinBackdrop) closePinModal();
  });

  pinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const entered = pinInput.value.trim();
    if (!entered) return;
    familyPin = entered;
    localStorage.setItem(PIN_STORAGE_KEY, familyPin);
    updateLockButton();
    const nextAction = pendingProtectedAction;
    closePinModal();
    if (typeof nextAction === 'function') {
      nextAction();
    }
  });

  function isAuthError(error) {
    if (!error) return false;
    const msg = `${error.message || ''} ${error.code || ''}`.toLowerCase();
    return error.code === '42501' || msg.includes('row-level security') || msg.includes('permission denied');
  }

  function handleAuthFailure(retryCallback) {
    clearSavedPin();
    setSyncStatus('🔒 Неверный пароль');
    syncFromCloud();
    openPinModal(retryCallback, 'Неверный семейный пароль. Попробуйте ещё раз.');
  }

  function setSyncStatus(text) {
    syncBadge.textContent = text;
  }

  function getRecipeCategories(recipe) {
    const primary = (recipe.category || 'Прочее').trim();
    const secondary = (recipe.category_secondary || '').trim();
    const list = [primary];
    if (secondary && secondary !== primary) {
      list.push(secondary);
    }
    return list;
  }

  function saveToLocalCache() {
    try {
      localStorage.setItem('family_recipes', JSON.stringify(recipes));
    } catch (e) {
      console.warn('Локальный кэш заполнен:', e);
    }
  }

  async function syncFromCloud() {
    const db = getDbClient();
    if (!db) {
      if (!hasValidUrl) setSyncStatus('⚙️ Проверьте SUPABASE_URL');
      else if (!hasValidKey) setSyncStatus('⚙️ Проверьте SUPABASE_ANON_KEY');
      else setSyncStatus('📴 Не загрузился скрипт Supabase');
      return;
    }

    setSyncStatus('🔄 Синхронизация...');
    try {
      const { data, error } = await db
        .from('recipes')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;

      recipes = data;
      saveToLocalCache();
      renderRecipes(searchInput.value);
      setSyncStatus('☁️ Синхронизировано');
    } catch (err) {
      console.warn('Ошибка связи с облаком, работаем из кэша:', err?.message || err, err);
      setSyncStatus('📴 Оффлайн-копия');
    }
  }

  syncBadge.addEventListener('click', syncFromCloud);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      syncFromCloud();
    }
  });

  function renderCategoryButtons() {
    const allButtons = ['Все', ...CATEGORIES];
    categoryButtonsContainer.innerHTML = allButtons.map(cat => {
      const isActive = selectedCategory === cat ? 'active' : '';
      return `<button type="button" class="cat-btn ${isActive}" data-category="${escapeAttr(cat)}">${escapeHtml(cat)}</button>`;
    }).join('');

    categoryButtonsContainer.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedCategory = btn.getAttribute('data-category');
        renderCategoryButtons();
        renderRecipes(searchInput.value);
      });
    });
  }

  choosePhotoBtn.addEventListener('click', () => {
    photoInput.click();
  });

  photoInput.addEventListener('change', () => {
    const selected = photoInput.files[0];
    fileNameLabel.textContent = selected ? selected.name : 'Файл не выбран';
  });

  toggleFormBtn.addEventListener('click', () => {
    requirePin(() => {
      const wasEditing = editingId !== null;
      const isOpen = form.classList.contains('active');
      resetFormState();
      if (!isOpen || wasEditing) {
        form.classList.add('active');
        document.getElementById('title').focus();
      }
    });
  });

  cancelBtn.addEventListener('click', resetFormState);

  function startEditRecipe(id) {
    requirePin(() => {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      editingId = recipe.id;
      formTitle.textContent = 'Редактирование рецепта';
      submitBtn.textContent = 'Сохранить изменения';

      document.getElementById('title').value = recipe.title;
      categorySelect.value = recipe.category || 'Прочее';
      categorySecondarySelect.value = (recipe.category_secondary && recipe.category_secondary !== recipe.category)
        ? recipe.category_secondary
        : '';
      document.getElementById('ingredients').value = recipe.ingredients;
      document.getElementById('steps').value = recipe.steps;

      photoInput.value = '';
      fileNameLabel.textContent = recipe.photo ? 'Текущее фото сохранено' : 'Файл не выбран';

      if (recipe.photo) {
        currentPhotoPreview.src = recipe.photo;
        currentPhotoBox.classList.add('active');
      } else {
        currentPhotoBox.classList.remove('active');
        currentPhotoPreview.src = '';
      }

      form.classList.add('active');
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function toggleSteps(id) {
    if (expandedStepsIds.has(id)) {
      expandedStepsIds.delete(id);
    } else {
      expandedStepsIds.add(id);
    }
    renderRecipes(searchInput.value);
  }

  function formatRecipeForShare(recipe) {
    const tags = getRecipeCategories(recipe).map(c => `#${c}`).join(' ');
    return [
      `${recipe.title} (${tags})`,
      '',
      'Ингредиенты:',
      recipe.ingredients,
      '',
      'Приготовление:',
      recipe.steps
    ].join('\n');
  }

  function openShareMenu(id) {
    const recipe = recipes.find(r => r.id === id);
    if (!recipe) return;

    activeShareText = formatRecipeForShare(recipe);
    const encodedText = encodeURIComponent(activeShareText);
    const encodedSubject = encodeURIComponent(`Рецепт: ${recipe.title}`);

    shareRecipeSubtitle.textContent = recipe.title;
    shareTelegramLink.href = `tg://msg?text=${encodedText}`;
    shareWhatsappLink.href = `https://wa.me/?text=${encodedText}`;
    shareSmsLink.href = `sms:?body=${encodedText}`;
    shareEmailLink.href = `mailto:?subject=${encodedSubject}&body=${encodedText}`;

    shareCopyBtn.textContent = 'Скопировать текст рецепта';
    shareBackdrop.classList.add('open');
  }

  function closeShareMenu() {
    shareBackdrop.classList.remove('open');
  }

  shareCloseBtn.addEventListener('click', closeShareMenu);
  shareBackdrop.addEventListener('click', (e) => {
    if (e.target === shareBackdrop) closeShareMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (shareBackdrop.classList.contains('open')) closeShareMenu();
      if (pinBackdrop.classList.contains('open')) closePinModal();
    }
  });

  async function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.position = 'fixed';
    helper.style.left = '-9999px';
    document.body.appendChild(helper);
    helper.select();
    document.execCommand('copy');
    document.body.removeChild(helper);
  }

  shareCopyBtn.addEventListener('click', async () => {
    if (!activeShareText) return;
    try {
      await copyToClipboard(activeShareText);
      shareCopyBtn.textContent = '✓ Рецепт скопирован';
      setTimeout(() => {
        shareCopyBtn.textContent = 'Скопировать текст рецепта';
      }, 1800);
    } catch (err) {
      alert('Не удалось скопировать текст рецепта.');
    }
  });

  function compressImage(file) {
    return new Promise((resolve) => {
      if (!file) { resolve(''); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxWidth = 800;
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function submitRecipeForm() {
    const db = getDbClient();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Сохранение...';

    const photoFile = photoInput.files[0];
    const titleVal = document.getElementById('title').value.trim();
    const categoryVal = categorySelect.value || 'Прочее';
    const rawSecondary = categorySecondarySelect.value || '';
    const categorySecondaryVal = (rawSecondary && rawSecondary !== categoryVal) ? rawSecondary : '';
    const ingredientsVal = document.getElementById('ingredients').value.trim();
    const stepsVal = document.getElementById('steps').value.trim();

    if (editingId !== null) {
      const index = recipes.findIndex(r => r.id === editingId);
      if (index !== -1) {
        let updatedPhoto = recipes[index].photo;
        if (photoFile) {
          updatedPhoto = await compressImage(photoFile);
        }

        const updatedRecipe = {
          id: editingId,
          title: titleVal,
          category: categoryVal,
          category_secondary: categorySecondaryVal,
          ingredients: ingredientsVal,
          steps: stepsVal,
          photo: updatedPhoto
        };

        if (db) {
          setSyncStatus('🔄 Сохранение в облако...');
          const { error } = await db
            .from('recipes')
            .update({
              title: updatedRecipe.title,
              category: updatedRecipe.category,
              category_secondary: updatedRecipe.category_secondary,
              ingredients: updatedRecipe.ingredients,
              steps: updatedRecipe.steps,
              photo: updatedRecipe.photo
            })
            .eq('id', editingId);

          if (isAuthError(error)) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Сохранить изменения';
            handleAuthFailure(submitRecipeForm);
            return;
          }

          setSyncStatus(error ? '📴 Сохранено локально' : '☁️ Синхронизировано');
        }

        recipes[index] = updatedRecipe;
        saveToLocalCache();
      }
    } else {
      const photoData = await compressImage(photoFile);
      const newRecipe = {
        id: Date.now(),
        title: titleVal,
        category: categoryVal,
        category_secondary: categorySecondaryVal,
        ingredients: ingredientsVal,
        steps: stepsVal,
        photo: photoData
      };

      if (db) {
        setSyncStatus('🔄 Отправка в облако...');
        const { error } = await db.from('recipes').insert([newRecipe]);

        if (isAuthError(error)) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Сохранить рецепт';
          handleAuthFailure(submitRecipeForm);
          return;
        }

        setSyncStatus(error ? '📴 Сохранено локально' : '☁️ Синхронизировано');
      }

      recipes.unshift(newRecipe);
      saveToLocalCache();
    }

    resetFormState();
    renderRecipes(searchInput.value);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    requirePin(submitRecipeForm);
  });

  function deleteRecipe(id) {
    requirePin(async () => {
      if (!confirm('Точно удалить этот рецепт?')) return;
      const db = getDbClient();

      if (db) {
        setSyncStatus('🔄 Удаление из облака...');
        const { error } = await db.from('recipes').delete().eq('id', id);

        if (isAuthError(error)) {
          handleAuthFailure(() => deleteRecipe(id));
          return;
        }

        setSyncStatus(error ? '📴 Удалено локально' : '☁️ Синхронизировано');
      }

      recipes = recipes.filter(r => r.id !== id);
      expandedStepsIds.delete(id);
      if (editingId === id) {
        resetFormState();
      }
      saveToLocalCache();
      renderRecipes(searchInput.value);
    });
  }

  function renderRecipes(filter = '') {
    const query = filter.trim().toLowerCase();

    const filtered = recipes.filter(r => {
      const cats = getRecipeCategories(r);
      const matchesCategory = selectedCategory === 'Все' || cats.includes(selectedCategory);
      const matchesQuery =
        !query ||
        r.title.toLowerCase().includes(query) ||
        r.ingredients.toLowerCase().includes(query) ||
        cats.some(c => c.toLowerCase().includes(query));
      return matchesCategory && matchesQuery;
    });

    if (filtered.length === 0) {
      container.style.display = 'block';
      const message = selectedCategory === 'Все'
        ? 'Пока нет рецептов. Нажмите «+ Добавить рецепт», чтобы записать первый!'
        : `В категории «${escapeHtml(selectedCategory)}» пока нет рецептов.`;
      container.innerHTML = `<div class="empty-state">${message}</div>`;
      return;
    }

    container.style.display = 'grid';
    container.innerHTML = filtered.map(r => {
      const cats = getRecipeCategories(r);
      const isOpen = expandedStepsIds.has(r.id);
      const tagsHtml = cats.map(c => `<span class="recipe-tag">#${escapeHtml(c)}</span>`).join('');

      return `
        <div class="recipe-card ${r.photo ? '' : 'no-photo'}">
          <button type="button" class="btn btn-icon-round card-share-btn" onclick="openShareMenu(${r.id})" title="Поделиться рецептом" aria-label="Поделиться рецептом">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
          </button>
          ${r.photo ? `<img src="${r.photo}" alt="${escapeAttr(r.title)}" class="recipe-img">` : ''}
          <div class="recipe-body">
            <h3 class="recipe-title">${escapeHtml(r.title)}</h3>
            <div class="recipe-section-title">Ингредиенты</div>
            <p class="recipe-text">${escapeHtml(r.ingredients)}</p>

            <div class="steps-panel ${isOpen ? 'open' : ''}" id="steps-${r.id}">
              <div class="recipe-section-title">Приготовление</div>
              <p class="recipe-text">${escapeHtml(r.steps)}</p>
            </div>

            <div class="recipe-tags-row">${tagsHtml}</div>

            <div class="recipe-footer">
              <button type="button" class="btn btn-steps ${isOpen ? 'open' : ''}" onclick="toggleSteps(${r.id})">
                ${isOpen ? 'Скрыть описание' : 'Описание действий'}
              </button>
              <button type="button" class="btn btn-icon-round" onclick="startEditRecipe(${r.id})" title="Редактировать рецепт" aria-label="Редактировать рецепт">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </button>
              <button type="button" class="btn btn-danger" onclick="deleteRecipe(${r.id})">Удалить</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeAttr(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  searchInput.addEventListener('input', (e) => renderRecipes(e.target.value));

  updateLockButton();
  renderCategoryButtons();
  renderRecipes();
  syncFromCloud();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => {
        console.warn('Service Worker не зарегистрирован:', err);
      });
    });
  }
</script>

</body>
</html>
